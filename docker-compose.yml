# LeadForge AI - full stack (frontend, backend, scraper, MongoDB Atlas, redis)
#
# Configure MONGODB_URI in the root .env before starting.
#   docker compose up --build
#   docker compose exec backend npm run seed
#
# Default mode is MOCK: no request ever reaches usdirectory.com.
# Set SCRAPER_MODE=live in backend/.env and scraper/.env for real runs.

services:
  redis:
    image: redis:7-alpine
    container_name: leadforge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  scraper:
    build:
      context: ./scraper
    container_name: leadforge-scraper
    restart: unless-stopped
    env_file:
      - ./scraper/.env
    environment:
      SCRAPER_MODE: ${SCRAPER_MODE:-mock}
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on: []

  backend:
    build:
      context: ./backend
    container_name: leadforge-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the root .env}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-leadforge}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}
      MONGODB_CONNECT_TIMEOUT_MS: ${MONGODB_CONNECT_TIMEOUT_MS:-10000}
      MONGODB_SOCKET_TIMEOUT_MS: ${MONGODB_SOCKET_TIMEOUT_MS:-45000}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-20}
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: redis
      SCRAPER_URL: http://scraper:8000
      SCRAPER_MODE: ${SCRAPER_MODE:-mock}
      CLIENT_ORIGIN: http://localhost:8080
      PUBLIC_API_URL: http://backend:4000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      WORKER_ENABLED: 'true'
    ports:
      - '4000:4000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: leadforge-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend
